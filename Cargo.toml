[package]
name = "blightnet"
version = "1.0.0"
edition = "2021"
description = "Native Blightnet table — no browser"
license = "MIT"
publish = false

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "abort"

[dependencies]
eframe = { version = "0.31", default-features = true, features = ["default_fonts", "wgpu"] }
egui = "0.31"
egui_extras = { version = "0.31", features = ["image", "file"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rodio = { version = "0.20", default-features = true, features = ["vorbis"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rfd = "0.15"
base64 = "0.22"
cpal = "0.15"
native-tls = "0.2"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
getrandom = "0.2"
portable-pty = "0.8"
vte = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
